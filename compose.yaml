services:
  frontend:

  backend:

  worker:

  postgres:
    image: postgres:18
    environment:
      - POSTGRES_DG=pulsewatch
      - POSTGRES_USER=pulsewatch
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      -postgres_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:


volumes:
  postgres_data:

  rabbitmq_data: