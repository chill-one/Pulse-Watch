name: PulseWatch CI

on:
  push:
  pull_request:

jobs:
  style:
    name: Checkstyle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run Checkstyle
        run: mvn checkstyle:check

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: style

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run unit and integration tests
        run: mvn -Dcheckstyle.skip verify

  compose-validation:
    name: Docker Compose
    runs-on: ubuntu-latest
    needs: style

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate Docker Compose
        run: docker compose config -q


  spotbugs:
    name: SpotBugs
    runs-on: ubuntu-latest
    needs: style

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run SpotBugs
        run: mvn -Dcheckstyle.skip compile spotbugs:check


  frontend-lint:
    name: Frontend ESLint
    runs-on: ubuntu-latest
    needs: style

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint
        
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    needs: frontend-lint

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  playwright:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs:
      - frontend-build
      - test

    env:
      POSTGRES_PASSWORD: ci-postgres-password
      RABBITMQ_USER: pulsewatch
      RABBITMQ_PASSWORD: ci-rabbitmq-password

      SPRING_PROFILES_ACTIVE: ci

      PULSEWATCH_EMAIL_FROM: ci@example.com
      PULSEWATCH_EMAIL_TO: ci@example.com

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Start backend services
        run: docker compose up -d --build postgres rabbitmq backend

      - name: Wait for backend
        run: |
          for i in {1..30}; do
            if curl --fail http://localhost:8080/monitors; then
              echo "Backend is ready"
              exit 0
            fi

            echo "Waiting for backend..."
            sleep 2
          done

          echo "Backend failed to start"
          docker compose logs backend
          exit 1

      - name: Run Playwright tests
        working-directory: frontend
        run: npm run test:e2e
        env:
          CI: true

      - name: Show service logs on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color backend
          docker compose logs --no-color postgres
          docker compose logs --no-color rabbitmq

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      - name: Shut down services
        if: always()
        run: docker compose down -v