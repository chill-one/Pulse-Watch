name: PulseWatch CI

on:
  push:
  pull_request:

jobs:
  style:
    name: Checkstyle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run Checkstyle
        run: mvn checkstyle:check

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: style

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run unit and integration tests
        run: mvn -Dcheckstyle.skip verify

  compose-validation:
    name: Docker Compose
    runs-on: ubuntu-latest
    needs: style

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate Docker Compose
        run: docker compose config -q


  spotbugs:
    name: SpotBugs
    runs-on: ubuntu-latest
    needs: style

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run SpotBugs
        run: mvn -Dcheckstyle.skip compile spotbugs:check